name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start OrangeHRM with Docker
        run: |
          docker compose up -d
          echo "Waiting for MySQL..."
          sleep 45
          echo "Waiting for OrangeHRM..."
          sleep 30

      - name: Wait for OrangeHRM to be ready
        run: |
          timeout 120 bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 5; done'

      - name: Run Playwright tests
        env:
          ORANGEHRM_URL: http://localhost:3000
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: npx playwright test --project=chromium

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30